[project]
name = "continuum"
version = "0.1.0"
description = "CONTINUUM — An agentic production-intelligence system for film. Know you have the movie before you leave the set."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Benjamin Duske", email = "benduske1979@gmail.com" },
]
keywords = ["film-production", "ai-agents", "gemini", "clickhouse", "google-cloud"]

dependencies = [
    # Google Cloud / Gemini / ADK — upper bounds to guard hackathon week
    # from a background major-version bump on fast-moving SDKs.
    "google-adk>=2.0.0,<3",
    "google-genai>=1.0.0,<2",
    "google-cloud-aiplatform>=1.101.0,<2",
    "google-cloud-videointelligence>=2.13.0,<3",
    "google-cloud-storage>=2.14.0,<4",

    # ClickHouse (production memory) — pre-1.0 SDKs, hard-cap at next major.
    "mcp-clickhouse>=0.1.0,<1",
    "clickhouse-connect>=0.8.0,<1",

    # Parallel (research agent) — pre-1.0, hard-cap.
    "parallel-web>=0.1.0,<1",

    # Web framework
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "jinja2>=3.1.0,<4",

    # Utilities
    "pydantic>=2.0.0,<3",
    "python-dotenv>=1.0.0,<2",
    "httpx>=0.27.0,<1",
    "rich>=13.0.0,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/continuum"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Long lines in scripts/load_sample_data.py are inline sample-data strings; runner.py has
# long prompt/context strings passed to the ADK — breaking them hurts readability more than helps.
per-file-ignores = { "scripts/load_sample_data.py" = ["E501"], "src/continuum/runner.py" = ["E501"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
